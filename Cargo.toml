[package]
name = "keysound"
version = "0.1.0"
edition = "2024"

[dependencies]
evdev = "0.13.2"
libc = "0.2"
rodio = { version = "0.23.0", default-features = false, features = [
    "playback",
    "symphonia-wav",
    "symphonia-pcm",
    "symphonia-mp3",
    "symphonia-vorbis",
    "symphonia-ogg",
    "symphonia-flac",
    "symphonia-aac",
    "symphonia-isomp4",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
